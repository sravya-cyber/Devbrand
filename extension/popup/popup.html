<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevBrand</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <!-- Header -->
      <div class="header">
        <div class="logo">
          <div class="logo-icon">⚡</div>
          <span class="logo-text">DevBrand</span>
        </div>
        <div id="auth-status" class="auth-status"></div>
      </div>

      <!-- Not logged in state -->
      <div id="not-logged-in" class="screen hidden">
        <p class="hint">Log in to DevBrand to create posts from anywhere.</p>
        <div class="form-group">
          <input type="email" id="email" class="input" placeholder="Email" />
        </div>
        <div class="form-group">
          <input type="password" id="password" class="input" placeholder="Password" />
        </div>
        <button id="login-btn" class="btn btn-primary">Sign in</button>
        <p id="login-error" class="error hidden"></p>
      </div>

      <!-- Main state -->
      <div id="main-screen" class="screen hidden">
        <!-- Text input -->
        <div class="form-group">
          <label class="label">Content / Context</label>
          <textarea id="context-input" class="input textarea" rows="4"
            placeholder="Highlight text on any page, or type what you want to post about..."></textarea>
        </div>

        <!-- Options row -->
        <div class="row">
          <div class="form-group half">
            <label class="label">Platform</label>
            <select id="platform-select" class="input">
              <option value="linkedin">LinkedIn</option>
              <option value="twitter">Twitter / X</option>
            </select>
          </div>
          <div class="form-group half">
            <label class="label">Tone</label>
            <select id="tone-select" class="input">
              <option value="professional">Professional</option>
              <option value="casual">Casual</option>
              <option value="educational">Educational</option>
            </select>
          </div>
        </div>

        <button id="generate-btn" class="btn btn-primary">✨ Generate 3 Variants</button>

        <!-- Variants -->
        <div id="variants-section" class="hidden">
          <label class="label mt">Pick a variant</label>
          <div id="variants-list"></div>
        </div>

        <!-- Selected post preview -->
        <div id="post-preview" class="hidden">
          <label class="label mt">Selected Post</label>
          <textarea id="post-content" class="input textarea" rows="5"></textarea>

          <div class="form-group mt">
            <label class="label">Schedule for</label>
            <input type="datetime-local" id="schedule-time" class="input" />
          </div>

          <button id="schedule-btn" class="btn btn-success">📅 Schedule Post</button>
        </div>

        <p id="status-msg" class="status hidden"></p>
        <button id="logout-btn" class="btn btn-ghost mt-sm">Sign out</button>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
